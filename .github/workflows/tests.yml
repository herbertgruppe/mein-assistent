name: Tests

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

concurrency:
  group: mein-assistent-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      # HBE-3107: fastapi, python-multipart, jinja2 und PyYAML fehlten. Ohne sie
      # laesst sich api.py nicht importieren und lena_mail_triage_poller.py
      # findet seine Persona-Konfiguration nicht — beide Testgruppen liefen
      # deshalb hier nie mit, obwohl sie im Repo liegen und gruen sind.
      # Die Liste ist in einer frischen venv gegen den vollen Testumfang
      # geprueft, nicht geraten. Alle vier stehen ohnehin in requirements.txt.
      - name: Install dependencies
        run: pip install pytest requests python-dotenv "fastapi>=0.141.1" python-multipart PyYAML jinja2

      - name: Run regression tests (HBE-273 / HBE-277 — Dragan-Halluzinations-Klasse)
        run: python -m pytest tests/regression -v

      - name: Run security smoke-tests (HBE-610 — mail-move validators)
        run: python -m pytest tests/test_mail_move_validators.py -v

      - name: Run plaud_poller unit tests (HBE-853)
        run: python -m pytest tests/test_plaud_poller.py -v

      # HBE-3107: Am 16.09.2026 hat ein Default-Wert im Telegram-Endpoint einen
      # Sendesturm ausgeloest — 130 Versuche, 14 Testnachrichten an Sven. Die
      # Tests zu diesem Endpoint lagen im Repo, liefen hier aber nicht mit.
      # Glob statt Dateiliste, damit kuenftige Tests dieser Gruppen automatisch
      # erfasst werden.
      - name: Run Telegram tests (HBE-3107 — Sendesturm durch MarkdownV2-Default)
        run: python -m pytest tests/*telegram*.py -v

      - name: Run mail-triage tests (HBE-3044 ff. — 5-Schritte-Regel, Regeln, Konsequenzen)
        run: python -m pytest tests/test_mail_triage_*.py -v
