name: Tests

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

concurrency:
  group: mein-assistent-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      # HBE-3107: fastapi, python-multipart, jinja2 und PyYAML fehlten. Ohne sie
      # laesst sich api.py nicht importieren und lena_mail_triage_poller.py
      # findet seine Persona-Konfiguration nicht — beide Testgruppen liefen
      # deshalb hier nie mit, obwohl sie im Repo liegen und gruen sind.
      # Die Liste ist in einer frischen venv gegen den vollen Testumfang
      # geprueft, nicht geraten. Alle vier stehen ohnehin in requirements.txt.
      # httpx wird von starlette.testclient benoetigt (test_protocols.py) und ist
      # keine harte Abhaengigkeit von fastapi — ohne sie schlaegt der Import fehl.
      - name: Install dependencies
        run: pip install pytest requests python-dotenv "fastapi>=0.141.1" python-multipart PyYAML jinja2 httpx

      - name: Run regression tests (HBE-273 / HBE-277 — Dragan-Halluzinations-Klasse)
        run: python -m pytest tests/regression -v

      - name: Run security smoke-tests (HBE-610 — mail-move validators)
        run: python -m pytest tests/test_mail_move_validators.py -v

      - name: Run plaud_poller unit tests (HBE-853)
        run: python -m pytest tests/test_plaud_poller.py -v

      # HBE-3107: Am 16.09.2026 hat ein Default-Wert im Telegram-Endpoint einen
      # Sendesturm ausgeloest — 130 Versuche, 14 Testnachrichten an Sven. Die
      # Tests zu diesem Endpoint lagen im Repo, liefen hier aber nicht mit.
      # Glob statt Dateiliste, damit kuenftige Tests dieser Gruppen automatisch
      # erfasst werden.
      - name: Run Telegram tests (HBE-3107 — Sendesturm durch MarkdownV2-Default)
        run: python -m pytest tests/*telegram*.py -v

      - name: Run mail-triage tests (HBE-3044 ff. — 5-Schritte-Regel, Regeln, Konsequenzen)
        run: python -m pytest tests/test_mail_triage_*.py -v

      # Mails, die Lena ungefragt archiviert, tragen eine eigene Kategorie.
      # Faellt die weg, verschwindet Post unsichtbar im Archiv — deshalb im CI.
      - name: Run Lena-Mail tests (Auto-Archiv-Kategorie, Forward-Entwuerfe)
        run: python -m pytest tests/test_lena_mail_*.py -v

      # Tagesuebersicht statt 99 Einzelerinnerungen. Besonders die Werktags-
      # und Einmal-pro-Tag-Logik: faellt sie aus, merkt man es erst, wenn der
      # Kanal wieder zugespammt ist.
      - name: Run Protokoll-Uebersicht tests
        run: python -m pytest tests/test_protokoll_uebersicht.py -v

      # Rueckweg von einem Vorgang zur Liste. Faellt er weg, endet jede
      # Freigabe wieder in einer Sackgasse — bei 21 offenen Vorgaengen
      # 21 Mal derselbe Griff.
      - name: Run Rueckkehr-Tests
        run: python -m pytest tests/test_rueckkehr_uebersicht.py -v

      # Maras Weg zum Transkript. Faellt er aus, blockiert sie Auftraege mit
      # der Fehldiagnose "Token abgelaufen" — so geschehen bei 17 Auftraegen,
      # waehrend der Token durchgehend gueltig war.
      - name: Run Transkript-Endpunkt-Tests
        run: python -m pytest tests/test_transkript_endpunkt.py -v

      # Svens Pruefvermerk zur Sprecherzuordnung und die Titelpflege.
      # Plaud bietet fuer beides kein Feld — faellt es hier aus, ist nicht
      # mehr nachvollziehbar, welche Aufnahme schon angesehen wurde.
      - name: Run Sprecher-Vermerk-Tests
        run: python -m pytest tests/test_sprecher_vermerk.py -v

      # Uebernahme der Zuordnung in den Editor und der Board-Vorschlag.
      # Faellt das aus, trifft Sven jede Entscheidung zweimal.
      - name: Run Zuordnungs-Uebernahme-Tests
        run: python -m pytest tests/test_zuordnung_uebernahme.py -v

      # Zeitzonen: Graph und Plaud liefern UTC ohne Kennzeichnung im
      # Zeitstempel. Faellt die Umrechnung aus, stehen im Sommer alle Termine
      # zwei Stunden zu frueh da — und nach der Umstellung eine.
      - name: Run Zeitzonen-Tests
        run: python -m pytest tests/test_zeitzone.py -v

      # Die Neu-laden-Knoepfe. Faellt der refresh-Schalter weg, ist ein neu
      # angelegtes Asana-Board bis zu 15 Minuten unsichtbar.
      - name: Run Neu-laden-Tests
        run: python -m pytest tests/test_neu_laden.py -v

      # Die gesamte Protokoll-Strecke — DB-Layer, Review-Editor, Zuordnungs-Stufe
      # — lief hier nie mit, obwohl sie seit Monaten im Repo liegt. Grund war ein
      # einzelner dauerhaft roter Test: er schickte den Authentik-Header ueber den
      # Standard-TestClient, der sich als Host "testclient" meldet und damit zu
      # Recht nicht als vertrauenswuerdiger Proxy gilt. Mit diesem einen roten
      # Test liess sich die Datei nicht aufnehmen. Jetzt repariert.
      - name: Run protocol workflow tests (Review-Editor + Zuordnungs-Stufe)
        run: python -m pytest tests/test_protocols.py -v
